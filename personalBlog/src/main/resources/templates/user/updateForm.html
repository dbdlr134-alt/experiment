<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>会員情報の編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<header class="blog-header" onclick="location.href='/'" style="cursor: pointer;">
    <h1 class="blog-title">My Coding Life</h1>
    <p class="blog-subtitle">日々の生活と開発の記録を残す場所</p>
</header>

<nav class="navbar navbar-expand-lg blog-nav sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="font-size: 0.9rem; color: #555;">ホーム</a>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                 <li class="nav-item d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <img th:src="${#authentication.principal.user.profileUrl != null ? #authentication.principal.user.profileUrl : 'https://dummyimage.com/40x40/dee2e6/6c757d.jpg'}"
                         class="rounded-circle me-2 border" 
                         style="width: 40px; height: 40px; object-fit: cover;">
                    <span class="me-3 text-secondary">ようこそ、<strong class="text-dark" sec:authentication="principal.user.nickname">User</strong>さん</span>
                    <a class="btn btn-outline-secondary btn-sm rounded-pill" href="/logout">ログアウト</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container main-box" style="max-width: 600px;">
    
    <div class="board-toolbar justify-content-center border-bottom-0 mb-4">
        <h3 class="fw-bold text-dark" style="color: #5a4a42 !important;">⚙️ 会員情報の編集</h3>
    </div>

    <form>
        <input type="hidden" id="id" th:value="${principal.user.id}">

        <div class="text-center mb-4">
            <img id="profile-img" 
                 th:src="${#strings.isEmpty(principal.user.profileUrl) ? 'https://dummyimage.com/150x150/dee2e6/6c757d.jpg' : principal.user.profileUrl}"
                 onerror="this.src='https://dummyimage.com/150x150/dee2e6/6c757d.jpg'"
                 class="rounded-circle shadow-sm" 
                 style="width: 150px; height: 150px; object-fit: cover; cursor: pointer;"
                 onclick="document.getElementById('profile-file').click();"
                 data-bs-toggle="tooltip" title="クリックして写真を変更">
            
            <input type="file" id="profile-file" style="display: none;" onchange="uploadProfileImage(this)">
            <p class="text-muted mt-2 small">画像をクリックして変更してください</p>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">ユーザーID（変更不可）</label>
            <input type="text" class="form-control" th:value="${principal.user.username}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">パスワードの変更</label>
            <input type="password" id="password" class="form-control" placeholder="変更する場合のみ入力（未入力なら保持）">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">ニックネーム</label>
            <input type="text" id="nickname" class="form-control" th:value="${principal.user.nickname}">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">電話番号</label>
            <input type="text" id="phoneNumber" class="form-control" th:value="${principal.user.phoneNumber}" readonly>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-5">
            <button type="button" class="btn btn-secondary rounded-pill py-2 px-4 fs-5" onclick="history.back()">キャンセル</button>
            <button type="button" onclick="update()" class="btn btn-write-custom rounded-pill py-2 px-5 fs-5">更新する</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 1. プロフィール画像のアップロード
    function uploadProfileImage(input) {
        if (input.files && input.files[0]) {
            let formData = new FormData();
            formData.append("image", input.files[0]);

            $.ajax({
                type: "PUT",
                url: "/api/user/profile",
                data: formData,
                contentType: false,
                processData: false,
                dataType: "json"
            }).done(function(resp) {
                $("#profile-img").attr("src", resp.data);
                alert("プロフィール画像が変更されました。");
            }).fail(function(error) {
                alert("アップロードに失敗しました（容量制限またはファイル形式を確認してください）");
            });
        }
    }

    // 2. 会員情報の更新
    function update() {
        if($("#nickname").val().trim() === "") {
            alert("ニックネームを入力してください。");
            return;
        }

        let data = {
            id: $("#id").val(),
            password: $("#password").val(),
            nickname: $("#nickname").val(),
            phoneNumber: $("#phoneNumber").val()
        };

        $.ajax({
            type: "PUT",
            url: "/user",
            data: JSON.stringify(data),
            contentType: "application/json; charset=utf-8",
            dataType: "json"
        }).done(function(resp) {
            alert("会員情報の変更が完了しました。再ログインしてください。");
            location.href = "/logout";
        }).fail(function(error) {
            alert("情報の更新に失敗しました。");
        });
    }
</script>

</body>
</html>
