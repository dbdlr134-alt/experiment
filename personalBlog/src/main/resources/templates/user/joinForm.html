<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規会員登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<header class="blog-header" onclick="location.href='/'" style="height: 200px; cursor: pointer;">
    <h1 class="blog-title" style="font-size: 2.5rem;">My Coding Life</h1>
    <p class="blog-subtitle">日々の生活と開発の記録を残す場所</p>
</header>

<nav class="navbar navbar-expand-lg blog-nav sticky-top">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">ホーム</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/auth/loginForm">ログイン</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container main-box" style="max-width: 600px;"> 
    <div class="board-toolbar justify-content-center border-bottom-0 mb-4">
        <h3 class="fw-bold text-dark" style="color: #5a4a42 !important;">👤 新規会員登録</h3>
    </div>

    <form>
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">ユーザーID</label>
            <div class="input-group">
                <input type="text" id="username" class="form-control" placeholder="4文字以上で入力してください">
                <button type="button" class="btn btn-outline-secondary" onclick="checkUsername()">重複確認</button>
            </div>
            <span id="usernameCheckRes" class="text-danger" style="font-size:12px; margin-left: 5px;"></span>
            <input type="hidden" id="usernameValid" value="false">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">パスワード</label>
            <input type="password" id="password" class="form-control" placeholder="8文字以上（英数字・記号）">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">ニックネーム</label>
            <div class="input-group">
                <input type="text" id="nickname" class="form-control" placeholder="ニックネームを入力してください">
                <button type="button" class="btn btn-outline-secondary" onclick="checkNickname()">重複確認</button>
            </div>
            <span id="nicknameCheckRes" class="text-danger" style="font-size:12px; margin-left: 5px;"></span>
            <input type="hidden" id="nicknameValid" value="false">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">電話番号</label>
            <div class="input-group">
                <input type="text" id="phoneNumber" class="form-control" placeholder="09012345678（数字のみ入力）">
                <button type="button" class="btn btn-outline-secondary" onclick="sendSms()">認証番号を送信</button>
            </div>
        </div>

        <div class="mb-4" id="verifyBox" style="display:none;">
            <label class="form-label fw-bold text-secondary">認証番号の入力</label>
            <div class="input-group">
                <input type="text" id="verifyCode" class="form-control" placeholder="送信された4桁の番号">
                <button type="button" class="btn btn-outline-primary" onclick="checkSms()">確認</button>
            </div>
            <input type="hidden" id="phoneValid" value="false">
        </div>

        <hr class="my-4">

        <div class="mb-3">
            <label class="form-label fw-bold text-dark">個人情報の収集および利用への同意（必須）</label>
            <textarea class="form-control bg-light" rows="4" style="font-size: 0.85rem; resize: none;" readonly>
1. 収集する個人情報の項目
   - 必須項目: ユーザーID、パスワード、ニックネーム、電話番号

2. 個人情報の収集および利用目的
   - 会員識別および本人確認
   - サービス利用に伴うお知らせの通知およびお問い合わせ対応
   - 不正登録の防止および非認可使用の防止

3. 個人情報の保有および利用期間
   - 会員退会時まで保有します。
   - ただし、関係法令により保存の必要がある場合は、当該期間中保管します。
            </textarea>
            <div class="form-check mt-2">
                <input type="checkbox" class="form-check-input" id="agreeTerms">
                <label class="form-check-label" for="agreeTerms">規約に同意します。</label>
            </div>
        </div>

        <div class="d-grid gap-2 mt-4">
            <button type="button" onclick="join()" class="btn btn-write-custom rounded-pill py-2 fs-5">登録を完了する</button>
        </div>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 1. ユーザーIDの重複チェック
    function checkUsername() {
        let username = $("#username").val();
        if(username.trim().length < 4) {
             $("#usernameCheckRes").text("ユーザーIDは4文字以上で入力してください。").removeClass("text-success").addClass("text-danger");
             return;
        }

        $.get("/api/check-username?username=" + username, function(res) {
            if(res.data) { 
                $("#usernameCheckRes").text("既に存在しているユーザーIDです。").removeClass("text-success").addClass("text-danger");
                $("#usernameValid").val("false");
            } else {
                $("#usernameCheckRes").text("使用可能なユーザーIDです。").removeClass("text-danger").addClass("text-success");
                $("#usernameValid").val("true");
            }
        });
    }
    
    // 1-2. ニックネームの重複チェック
    function checkNickname() {
        let nickname = $("#nickname").val();
        if(nickname.trim().length < 1) {
             $("#nicknameCheckRes").text("ニックネームを入力してください。").removeClass("text-success").addClass("text-danger");
             return;
        }

        $.get("/api/check-nickname?nickname=" + nickname, function(res) {
            if(res.data) {
                $("#nicknameCheckRes").text("既に存在しているニックネームです。").removeClass("text-success").addClass("text-danger");
                $("#nicknameValid").val("false");
            } else {
                $("#nicknameCheckRes").text("使用可能なニックネームです。").removeClass("text-danger").addClass("text-success");
                $("#nicknameValid").val("true");
            }
        });
    }

    // 2. 認証番号送信
    function sendSms() {
        let phoneNumber = $("#phoneNumber").val();
        if(!phoneNumber) { alert("電話番号を入力してください。"); return; }
        
        let $btn = $(event.target);
        $btn.prop("disabled", true).text("送信中...");

        $.ajax({
            type: "POST",
            url: "/api/sms/send",
            contentType: "application/json",
            data: JSON.stringify({phoneNumber: phoneNumber}),
            success: function(res) {
                alert("認証番号を送信しました。");
                $("#verifyBox").fadeIn();
                $btn.prop("disabled", false).text("再送信");
            },
            error: function(err) { 
                alert("送信に失敗しました。番号を確認してください。"); 
                $btn.prop("disabled", false).text("認証番号を送信");
            }
        });
    }

    // 3. 認証番号確認
    function checkSms() {
        let phoneNumber = $("#phoneNumber").val();
        let code = $("#verifyCode").val();
        
        $.ajax({
            type: "POST",
            url: "/api/sms/verify",
            contentType: "application/json",
            data: JSON.stringify({phoneNumber: phoneNumber, code: code}),
            success: function(res) {
                if(res.data) {
                    alert("認証されました。");
                    $("#phoneValid").val("true");
                    $("#phoneNumber").prop("readonly", true);
                    $("#verifyCode").prop("readonly", true);
                    $("#verifyBox button").prop("disabled", true).text("完了");
                } else {
                    alert("認証番号が一致しません。");
                }
            }
        });
    }

    // 4. 会員登録リクエスト
    function join() {
        if($("#usernameValid").val() !== "true") { alert("ユーザーIDの重複確認を行ってください。"); return; }
        if($("#password").val().length < 4) { alert("パスワードを入力してください。"); return; }
        if($("#nicknameValid").val() !== "true") { alert("ニックネームの重複확인を行ってください。"); return; }
        if($("#phoneValid").val() !== "true") { alert("電話番号の認証を完了してください。"); return; }
        
        if(!$("#agreeTerms").is(":checked")) { 
            alert("利用規約に同意してください。"); 
            $("#agreeTerms").focus();
            return; 
        }
        
        let data = {
            username: $("#username").val(),
            password: $("#password").val(),
            nickname: $("#nickname").val(),
            phoneNumber: $("#phoneNumber").val()
        };

        $.ajax({
            type: "POST",
            url: "/auth/joinProc",
            contentType: "application/json",
            data: JSON.stringify(data),
            success: function(res) {
                if(res.status === 200) {
                    alert("会員登録が完了しました！ログインしてください。");
                    location.href = "/auth/loginForm";
                } else {
                    alert(res.data); 
                }
            },
            error: function(err) {
                alert("登録中にエラーが発生しました。");
            }
        });
    }
</script>
</body>
</html>
