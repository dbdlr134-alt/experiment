<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワードの再設定</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<header class="blog-header" onclick="location.href='/'" style="cursor: pointer;">
    <h1 class="blog-title">My Coding Life</h1>
    <p class="blog-subtitle">日々の生活と開発の記録を残す場所</p>
</header>

<nav class="navbar navbar-expand-lg blog-nav">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="font-size: 0.9rem; color: #555;">ホーム</a>
        <div class="ms-auto">
             <a class="nav-link d-inline-block" href="/auth/joinForm">新規登録</a>
        </div>
    </div>
</nav>

<div class="container main-box" style="max-width: 500px; margin-top: 50px;">
    <div class="login-card">
        
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #4a4a4a;">🔒 パスワードの再設定</h3>
            <p class="text-muted small">登録済みのユーザーIDと電話番号を入力してください。<br>初期パスワードを<strong>ショートメッセージ(SMS)</strong>で送信いたします。</p>
        </div>

        <form>
            <div class="mb-3">
                <label class="form-label fw-bold small">ユーザーID</label>
                <input type="text" id="username" class="form-control" placeholder="ユーザーIDを入力">
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold small">電話番号</label>
                <input type="text" id="phoneNumber" class="form-control" placeholder="電話番号を入力 (例: 09012345678)">
            </div>

            <div class="d-grid gap-2">
                <button type="button" onclick="findPw()" class="btn btn-brown">パスワードを再発行する</button>
                <a href="/auth/loginForm" class="btn btn-outline-secondary rounded-pill py-2">ログインに戻る</a>
            </div>
        </form>
        
    </div>
</div>

<script>
    function findPw() {
        let data = {
            username: $("#username").val(),
            phoneNumber: $("#phoneNumber").val()
        };

        if(!data.username || !data.phoneNumber) {
            alert("ユーザーIDと電話番号を両方入力してください。");
            return;
        }

        // ボタン無効化 (二重クリック防止)
        $(".btn-brown").prop("disabled", true).text("送信中...");

        $.ajax({
            type: "POST",
            url: "/auth/reset-password",
            data: JSON.stringify(data),
            contentType: "application/json; charset=utf-8",
            dataType: "json"
        }).done(function(resp) {
            alert("初期パスワードをSMSで送信しました。\nご確認の上、ログインしてください。");
            location.href = "/auth/loginForm"; // ログイン画面へ移動
        }).fail(function(error) {
            // ボタンの再有効化
            $(".btn-brown").prop("disabled", false).text("パスワードを再発行する");
            
            if(error.responseJSON && error.responseJSON.data) {
                alert(error.responseJSON.data);
            } else {
                alert("情報が一致しないか、存在しない会員です。");
            }
        });
    }
</script>

</body>
</html>
