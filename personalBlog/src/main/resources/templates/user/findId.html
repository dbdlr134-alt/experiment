<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザーIDの検索</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet"> 
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<header class="blog-header" onclick="location.href='/'" style="cursor: pointer;">
    <h1 class="blog-title">My Coding Life</h1>
    <p class="blog-subtitle">日々の生活と開発の記録を残す場所</p>
</header>

<div class="container main-box" style="max-width: 500px; margin-top: 50px;">
    <div class="login-card">
        
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #4a4a4a;">🔍 ユーザーIDの検索</h3>
            <p class="text-muted small">登録時に入력한 ニックネームを入力してください。</p>
        </div>

        <form>
            <div class="mb-4">
                <label class="form-label fw-bold small">ニックネーム</label>
                <input type="text" id="nickname" class="form-control" placeholder="ニックネームを入力（例：田中）">
            </div>

            <div class="d-grid gap-2">
                <button type="button" onclick="findId()" class="btn btn-brown">ユーザーIDを検索</button>
                <a href="/auth/loginForm" class="btn btn-outline-secondary rounded-pill py-2">ログインに戻る</a>
            </div>
        </form>
        
        <div id="result-box" class="alert alert-warning mt-4 d-none text-center">
            <p class="mb-1 small">お客様のユーザーIDは：</p>
            <h4 class="fw-bold" style="color: #5a4a42;" id="found-id-text"></h4>
        </div>

    </div>
</div>

<script>
    function findId() {
        let nickname = $("#nickname").val();

        if(!nickname) {
            alert("ニックネームを入力してください。");
            return;
        }

        $.ajax({
            type: "POST",
            url: "/auth/find-id",
            data: JSON.stringify({nickname: nickname}),
            contentType: "application/json; charset=utf-8",
            dataType: "json"
        }).done(function(resp) {
            // 成功時、結果を表示
            $("#result-box").removeClass("d-none");
            $("#found-id-text").text(resp.data);
        }).fail(function(error) {
            // 失敗時、エラーメッセージを表示
            if(error.responseJSON && error.responseJSON.data) {
                alert(error.responseJSON.data);
            } else {
                alert("ユーザーIDの検索に失敗しました。");
            }
        });
    }
</script>

</body>
</html>
