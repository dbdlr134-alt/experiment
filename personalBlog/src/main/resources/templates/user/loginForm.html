<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<header class="blog-header" onclick="location.href='/'" style="cursor: pointer;">
    <h1 class="blog-title">My Coding Life</h1>
    <p class="blog-subtitle">日々の生活と開発の記録を残す場所</p>
</header>

<nav class="navbar navbar-expand-lg blog-nav">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/" style="font-size: 0.9rem; color: #555;">ホーム</a>
        <div class="ms-auto">
             <a class="nav-link d-inline-block" href="/auth/joinForm">新規登録</a>
        </div>
    </div>
</nav>

<div class="container main-box">
    <div class="login-card">
        
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #4a4a4a;"><i class="bi bi-lock-fill text-warning me-2"></i>ログイン</h3>
        </div>

        <form action="/auth/loginProc" method="post">
            
            <div class="mb-3">
                <label for="username" class="form-label">ユーザーID</label>
                <input type="text" name="username" class="form-control" id="username" placeholder="ユーザーIDを入力してください">
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">パスワード</label>
                <input type="password" name="password" class="form-control" id="password" placeholder="パスワードを入力してください">
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted small" for="rememberMe">
                    ログイン状態を保持する
                </label>
            </div>

            <button id="btn-login" class="btn btn-brown mb-2">ログイン</button>
            
            <a href="/oauth2/authorization/google" class="btn btn-google">
                <i class="bi bi-google me-2" style="color: #EA4335; font-size: 1.1rem;"></i>
                Googleでログイン
            </a>

            <div class="d-flex justify-content-between mt-3 px-2">
                <a href="/auth/joinForm" class="text-decoration-none text-muted small">新規登録</a>
                <div>
                    <a href="/auth/findId" class="text-decoration-none text-muted small me-2">ユーザーIDの検索</a>
                    <span class="text-muted small">|</span>
                    <a href="/auth/findPassword" class="text-decoration-none text-muted small ms-2">パスワードの再設定</a>
                </div>
            </div>
            
        </form>
    </div>
</div>

</body>
</html>
