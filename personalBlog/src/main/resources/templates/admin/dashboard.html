<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管理者ページ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<header class="blog-header" onclick="location.href='/'" style="height: 150px; cursor: pointer;">
    <h1 class="blog-title" style="font-size: 2rem;">Admin Dashboard</h1>
    <p class="blog-subtitle">ブログ管理者モード</p>
</header>

<nav class="navbar navbar-expand-lg blog-nav sticky-top">
    <div class="container-fluid">
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/">ブログホームへ</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
             <li class="nav-item"><a class="nav-link" href="/logout">ログアウト</a></li>
        </ul>
    </div>
</nav>

<div class="container main-box" style="max-width: 1000px;">
    
    <div class="row mb-5">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm" style="background-color: #fcf8f3;">
                <div class="card-body text-center py-4">
                    <h5 class="text-secondary fw-bold">総会員数</h5>
                    <h2 class="fw-bold" style="color: #8c6645;" th:text="${users.size()} + '名'">0名</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
             <div class="card border-0 shadow-sm" style="background-color: #fcf8f3;">
                <div class="card-body text-center py-4">
                    <h5 class="text-secondary fw-bold">全記事数</h5>
                    <h2 class="fw-bold" style="color: #8c6645;" th:text="${posts.totalElements} + '件'">0件</h2>
                </div>
            </div>
        </div>
    </div>

    <h5 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-people-fill"></i> 会員管理</h5>
    <table class="table table-hover text-center mb-5">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>ユーザーID</th>
                <th>ニックネーム</th>
                <th>権限</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">user1</td>
                <td th:text="${user.nickname}">ニックネーム</td>
                <td>
                    <span th:if="${user.role.name() == 'ADMIN'}" class="badge bg-danger">管理者</span>
                    <span th:if="${user.role.name() == 'USER'}" class="badge bg-secondary">一般</span>
                </td>
                <td>
                    <button th:if="${user.role.name() != 'ADMIN'}" 
                            class="btn btn-sm btn-outline-danger" 
                            th:onclick="'deleteUser(' + ${user.id} + ')'">強制退会</button>
                </td>
            </tr>
        </tbody>
    </table>

    <h5 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-file-text-fill"></i> 最近の記事管理</h5>
    <table class="table table-hover mb-3">
        <thead class="table-light text-center">
            <tr>
                <th>No.</th>
                <th>タイトル</th>
                <th>投稿者</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post : ${posts}">
                <td class="text-center" th:text="${post.id}">1</td>
                <td th:text="${post.title}">記事タイトル</td>
                <td class="text-center" th:text="${post.user.nickname}">投稿者</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-danger" th:onclick="'deletePost(' + ${post.id} + ')'">削除</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // 1. 会員強制退会 (User Delete)
    function deleteUser(userId) {
        if(!confirm("本当にこの会員を強制退会させますか？\n（削除された会員情報は復旧できません。）")) return;
        
        $.ajax({
            type: "DELETE",
            url: "/api/user/" + userId,
            dataType: "json"
        }).done(function(resp) {
            if(resp.status === 403) {
                alert("権限がありません。");
            } else {
                alert("会員を強制退会させました。");
                location.reload(); 
            }
        }).fail(function(error) {
            alert("会員の削除に失敗しました: " + JSON.stringify(error));
        });
    }

    // 2. 記事削除 (Post Delete)
    function deletePost(postId) {
        if(!confirm("管理者権限でこの記事を削除しますか？")) return;
        
        $.ajax({
            type: "DELETE",
            url: "/api/board/" + postId,
            dataType: "json"
        }).done(function(resp) {
            alert("記事が削除されました。");
            location.reload();
        }).fail(function(error) {
            alert("記事の削除に失敗しました。");
        });
    }
</script>

</body>
</html>
