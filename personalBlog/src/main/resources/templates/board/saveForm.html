<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>記事の作成</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
    
    <link href="/css/style.css" rel="stylesheet">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
</head>
<body>

<header class="blog-header" onclick="location.href='/'" style="height: 200px; cursor: pointer;">
    <h1 class="blog-title" style="font-size: 2.5rem;">My Coding Life</h1>
    <p class="blog-subtitle">日々の生活と開発の記録を残す場所</p>
</header>

<nav class="navbar navbar-expand-lg blog-nav sticky-top">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">ホーム</a></li>
            </ul>
            
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/auth/loginForm">ログイン</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/auth/joinForm">新規登録</a></li>
                
                <li class="nav-item d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <a th:if="${#authentication.principal.user.role.name() == 'ADMIN'}" 
                       href="/admin" class="btn btn-danger btn-sm rounded-pill me-3">管理者</a>

                    <img th:src="${#authentication.principal.user.profileUrl != null ? #authentication.principal.user.profileUrl : 'https://dummyimage.com/40x40/dee2e6/6c757d.jpg'}"
                         class="rounded-circle me-2 border" 
                         style="width: 40px; height: 40px; object-fit: cover;">

                    <a href="/user/updateForm" class="text-decoration-none fw-bold text-dark me-3" 
                       data-bs-toggle="tooltip" title="会員情報編集">
                       <span sec:authentication="principal.user.nickname">User</span>さん
                    </a>
                    
                    <a class="btn btn-outline-secondary btn-sm rounded-pill" href="/logout">ログアウト</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container main-box">
    
    <div class="board-toolbar justify-content-center border-bottom-0 mb-4">
        <h3 class="fw-bold text-dark" style="color: #5a4a42 !important;">📝 記事を作成する</h3>
    </div>

    <form>
        <div class="mb-4">
            <label class="form-label fw-bold text-secondary">カテゴリ</label>
            <select class="form-select" id="boardType">
                <option value="DAILY">日常</option>
                <option value="DEV">開発記録</option>
                <option value="NOTICE" th:if="${#authentication.principal.user.role.name() == 'ADMIN'}">お知らせ</option>
                <option value="QNA">Q&A</option>
                <option value="GALLERY">ライブラリ</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold text-secondary">タイトル</label>
            <input type="text" class="form-control" placeholder="タイトルを入力してください" id="title">
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold text-secondary">内容</label>
            <textarea class="form-control" id="content"></textarea>
        </div>
    </form>
    
    <div class="d-flex justify-content-center mt-5 gap-2">
        <a href="/" class="btn btn-secondary px-4 rounded-pill">キャンセル</a>
        <button type="button" class="btn btn-write-custom px-5 rounded-pill" onclick="save()">投稿する</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 1. Summernote 実行
    $('#content').summernote({
        placeholder: '内容を入力してください',
        tabsize: 2,
        height: 400,
        toolbar: [
          ['style', ['style']],
          ['font', ['bold', 'underline', 'clear']],
          ['color', ['color']],
          ['para', ['ul', 'ol', 'paragraph']],
          ['table', ['table']],
          ['insert', ['link', 'picture', 'video']],
          ['view', ['fullscreen', 'codeview', 'help']]
        ]
    });

    // 2. 記事保存リクエスト
    function save() {
        let title = $("#title").val();
        let content = $("#content").val();

        if(title.trim() === "") {
            alert("タイトルを入力してください。");
            return;
        }
        if(content.trim() === "") {
            alert("内容を入力してください。");
            return;
        }

        let data = {
            title: title,
            content: content,
            boardType: $("#boardType").val()
        };

        $.ajax({
            type: "POST",
            url: "/api/board",
            contentType: "application/json; charset=utf-8",
            data: JSON.stringify(data),
            success: function(res) {
                alert("投稿が完了しました。");
                location.href = "/";
            },
            error: function(err) {
                if(err.responseJSON && err.responseJSON.message) {
                    alert(err.responseJSON.message);
                } else {
                    alert("投稿に失敗しました。");
                }
            }
        });
    }
</script>

</body>
</html>
