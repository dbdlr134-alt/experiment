<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>My Coding Life</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<header class="blog-header" onclick="location.href='/'" style="height: 200px; cursor: pointer;">
    <h1 class="blog-title" style="font-size: 2.5rem;">My Coding Life</h1>
    <p class="blog-subtitle">日々の生活と開発の記録を残す場所</p>
</header>

<nav class="navbar navbar-expand-lg blog-nav sticky-top">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">ホーム</a></li>
            </ul>
            
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/auth/loginForm">ログイン</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/auth/joinForm">新規登録</a></li>
                
                <li class="nav-item d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <a th:if="${#authentication.principal.user.role.name() == 'ADMIN'}" 
                       href="/admin" class="btn btn-danger btn-sm rounded-pill me-3">管理者</a>

                    <img th:src="${#authentication.principal.user.profileUrl != null ? #authentication.principal.user.profileUrl : 'https://dummyimage.com/40x40/dee2e6/6c757d.jpg'}"
                         class="rounded-circle me-2 border" 
                         style="width: 40px; height: 40px; object-fit: cover;">

                    <a href="/user/updateForm" class="text-decoration-none fw-bold text-dark me-3" 
                       data-bs-toggle="tooltip" title="会員情報編集">
                       <span sec:authentication="principal.user.nickname">User</span>さん
                    </a>
                    
                    <a class="btn btn-outline-secondary btn-sm rounded-pill" href="/logout">ログアウト</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container main-box">

    <div class="board-toolbar">
        <div class="category-filter">
            <a th:href="@{/(category='ALL')}" 
               th:classappend="${category == null || category == 'ALL'} ? 'active'">すべて</a>
               
            <a th:href="@{/(category='DAILY')}" 
               th:classappend="${category == 'DAILY'} ? 'active'">日常</a>
               
            <a th:href="@{/(category='DEV')}" 
               th:classappend="${category == 'DEV'} ? 'active'">開発記録</a>
               
            <a th:href="@{/(category='NOTICE')}" 
               th:classappend="${category == 'NOTICE'} ? 'active'">お知らせ</a>
               
            <a th:href="@{/(category='QNA')}" 
               th:classappend="${category == 'QNA'} ? 'active'">Q&A</a>
               
            <a th:href="@{/(category='GALLERY')}" 
               th:classappend="${category == 'GALLERY'} ? 'active'">ライブラリ</a>
        </div>

        <a sec:authorize="isAuthenticated()" href="/board/saveForm" class="btn btn-write-custom">
            <i class="bi bi-pencil-fill"></i> 投稿する
        </a>
    </div>

    <table class="board-table">
        <colgroup>
            <col style="width: 8%;">  <col style="width: 10%;"> <col style="width: auto;"> <col style="width: 12%;"> <col style="width: 12%;"> <col style="width: 8%;">  <col style="width: 8%;">  </colgroup>
        <thead>
            <tr>
                <th>No.</th>
                <th>カテゴリ</th>
                <th>タイトル</th>
                <th>投稿者</th>
                <th>作成日</th>
                <th>閲覧</th>
                <th>いいね</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="notice : ${notices}" class="table-secondary border-bottom border-dark fw-bold">
                <td><span class="badge bg-danger">必読</span></td> <td><span class="badge bg-danger">告知</span></td>
                
                <td class="title-col">
                    <a th:href="@{/board/{id}(id=${notice.id})}" class="text-dark text-decoration-none">
                        <span th:text="${notice.title}">お知らせのタイトル</span>
                        <span class="text-danger small" th:if="${notice.replys.size() > 0}" 
                              th:text="'[' + ${notice.replys.size()} + ']'"></span>
                    </a>
                </td>
                
                <td th:text="${notice.user.nickname}">管理者</td>
                <td th:text="${#dates.format(notice.createDate, 'yyyy-MM-dd')}">日付</td>
                <td th:text="${notice.count}">0</td>
                <td th:text="${notice.loves.size()}">0</td>
            </tr>
            <tr th:each="post : ${posts.content}">
                <td th:text="${post.id}">1</td>
                
				<td>
				    <th:block th:switch="${post.boardType.name()}">
				        <span th:case="'NOTICE'"  class="badge bg-danger">告知</span>
                        <span th:case="'DEV'"     class="badge bg-primary">開発</span>
                        <span th:case="'QNA'"     class="badge bg-warning text-dark">質問</span>
                        <span th:case="'GALLERY'" class="badge bg-info text-dark">資料</span>
                        <span th:case="*"         class="badge bg-success">日常</span>
                    </th:block>
				</td>
                
                <td class="title-col">
                    <a th:href="@{/board/{id}(id=${post.id})}">
                        <span th:text="${post.title}">記事のタイトルです。</span>
                        <span class="comment-cnt" th:if="${post.replys.size() > 0}" 
                              th:text="'[' + ${post.replys.size()} + ']'">[0]</span>
                    </a>
                </td>
                
                <td th:text="${post.user.nickname}">ニックネーム</td>
                <td th:text="${#dates.format(post.createDate, 'yyyy-MM-dd')}">2026-01-07</td>
                <td th:text="${post.count}">0</td>
                <td th:text="${post.loves.size()}">0</td>
            </tr>
            
            <tr th:if="${posts.empty}">
                <td colspan="7" class="py-5 text-center text-muted">
                    投稿された 記事がありません。最初の記事を書いてみませんか？
                </td>
            </tr>
        </tbody>
    </table>

    <div class="search-box">
        <form class="d-flex" method="GET" action="/">
            <input type="hidden" name="category" th:value="${category}">
            <input class="form-control" type="search" name="search" 
                   placeholder="キーワードを入力" th:value="${search}" style="width: 250px;">
            <button class="btn btn-secondary ms-2" type="submit">検索</button>
        </form>
    </div>

    <div class="mt-4" th:if="${!posts.empty}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${posts.first} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/(page=${posts.number - 1}, search=${search}, category=${category})}">前へ</a>
            </li>
            <li class="page-item" th:classappend="${posts.last} ? 'disabled'">
                <a class="page-link" 
                   th:href="@{/(page=${posts.number + 1}, search=${search}, category=${category})}">次へ</a>
            </li>
        </ul>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
